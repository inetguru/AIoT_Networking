# API_Intro 실습 - Python으로 HTTP API 호출하기
#   docker compose run --rm py 01_echo_get.py      (또는 run.cmd 01_echo_get.py)
# 정리: docker compose down

services:
  py:
    image: ghcr.io/inetguru/aiot-lab:v2
    working_dir: /work
    volumes:
      - ./python:/work
    entrypoint: ["python3", "-u"]
    environment:
      # 기본값은 모의 서버. 실제 기상청 API로 바꾸려면 .env.example 참고
      KMA_BASE: ${KMA_BASE:-http://mock-kma:4000}
      KMA_KEY: ${KMA_KEY:-mock-key}
      NAVER_ID: ${NAVER_ID:-}
      NAVER_SECRET: ${NAVER_SECRET:-}
      KAKAO_KEY: ${KAKAO_KEY:-}
    depends_on: [mock-kma]

  # 기상청 초단기실황 API를 흉내 내는 모의 서버 (Web_Intro와 같은 것을 재사용)
  mock-kma:
    image: ghcr.io/inetguru/aiot-lab:v2
    working_dir: /mock
    volumes:
      - ../Web_Intro/mock-kma:/mock
    command: node server.js
